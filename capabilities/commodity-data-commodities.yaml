naftiko: 1.0.0-alpha2
info:
  label: Archer Daniels Midland Commodity Data API — Commodities
  description: 'Archer Daniels Midland Commodity Data API — Commodities. 2 operations. Lead operation: Archer Daniels Midland
    List Commodities. Self-contained Naftiko capability covering one Archer Daniels Midland business surface.'
  tags:
  - Archer Daniels Midland
  - Commodities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ARCHER_DANIELS_MIDLAND_API_KEY: ARCHER_DANIELS_MIDLAND_API_KEY
capability:
  consumes:
  - type: http
    namespace: commodity-data-commodities
    baseUri: https://api.adm.com/v1
    description: Archer Daniels Midland Commodity Data API — Commodities business capability. Self-contained, no shared references.
    resources:
    - name: commodities
      path: /commodities
      operations:
      - name: listcommodities
        method: GET
        description: Archer Daniels Midland List Commodities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: Filter by commodity type (corn, soybeans, wheat, canola, etc.)
        - name: region
          in: query
          type: string
          description: Filter by sourcing region
    - name: commodities-commodityId
      path: /commodities/{commodityId}
      operations:
      - name: getcommodity
        method: GET
        description: Archer Daniels Midland Get Commodity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: commodityId
          in: path
          type: string
          description: Commodity identifier
          required: true
    authentication:
      type: apikey
      key: X-ADM-API-Key
      value: '{{env.ARCHER_DANIELS_MIDLAND_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: commodity-data-commodities-rest
    port: 8080
    description: REST adapter for Archer Daniels Midland Commodity Data API — Commodities. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/commodities
      name: commodities
      description: REST surface for commodities.
      operations:
      - method: GET
        name: listcommodities
        description: Archer Daniels Midland List Commodities
        call: commodity-data-commodities.listcommodities
        with:
          type: rest.type
          region: rest.region
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/commodities/{commodityid}
      name: commodities-commodityid
      description: REST surface for commodities-commodityId.
      operations:
      - method: GET
        name: getcommodity
        description: Archer Daniels Midland Get Commodity
        call: commodity-data-commodities.getcommodity
        with:
          commodityId: rest.commodityId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: commodity-data-commodities-mcp
    port: 9090
    transport: http
    description: MCP adapter for Archer Daniels Midland Commodity Data API — Commodities. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: archer-daniels-midland-list-commodities
      description: Archer Daniels Midland List Commodities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: commodity-data-commodities.listcommodities
      with:
        type: tools.type
        region: tools.region
      outputParameters:
      - type: object
        mapping: $.
    - name: archer-daniels-midland-get-commodity
      description: Archer Daniels Midland Get Commodity
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: commodity-data-commodities.getcommodity
      with:
        commodityId: tools.commodityId
      outputParameters:
      - type: object
        mapping: $.
