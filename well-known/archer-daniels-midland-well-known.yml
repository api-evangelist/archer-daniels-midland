note: >-
  ADM serves a real OpenID Connect / OAuth 2.0 authorization-server discovery document and a JWKS
  from its own www.adm.com host. Both are emitted by the Optimizely (Episerver) CMS that runs
  adm.com — the issuer is https://www.adm.com/ and the endpoints are under /api/episerver/connect/ —
  so they describe the website's own content-management authorization server, not a customer-facing
  API product. They are still first-party, published, machine-readable documents on ADM's domain and
  are recorded verbatim as such. /.well-known/security.txt, /api-catalog, /ai-plugin.json,
  /agent-card.json and /oauth-protected-resource all 404 with the site's HTML 404 page.
  api.adm.com — the baseURL carried in apis.yml and in every servers[] block of the three
  AE-authored OpenAPI documents — DOES NOT RESOLVE (NXDOMAIN, no A/AAAA record), so no
  /.well-known/ path could be probed there at all; that is recorded as an honest connection
  failure, not a 404.
  investors.adm.com answers HTTP 200 with an 11-byte "Invalid key" body for EVERY /.well-known/
  path, including ones that cannot exist. That is an SPA/edge catch-all, not a document, and every
  path on that host is therefore recorded as a miss.
