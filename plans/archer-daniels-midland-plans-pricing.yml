description: >-
  Archer Daniels Midland publishes no API pricing, no plans page, and no self-serve or
  contact-sales commercial surface for an API. This is not an enterprise "contact us" tier that we
  could not price — it is the absence of any published API product to price.
notes: >-
  ADM runs no public developer program. Its own llms.txt (HTTP 200, 7,412 bytes) enumerates the
  company's key pages and names no API, no developer portal, and no pricing for one. Commercial
  relationships with ADM are supplier and customer contracts negotiated directly; indirect
  procurement runs through Coupa and supplier ordering through EDI over third-party VANs, neither
  of which is an ADM-published API plan. The host every apis.yml baseURL names, api.adm.com, does
  not resolve.
